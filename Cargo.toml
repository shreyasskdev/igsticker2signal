[package]
name = "igsticker2signal"
version = "0.3.0"
edition = "2021"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
png = "0.17"
color_quant = "1.1"
fast_image_resize = "5"
rayon = "1"
ratatui = "0.29"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
incremental = false
